# REGENIE GWAS of antibody serostatus on the same 9,145 participants:
#   seropositivity    binary 0/1; step 1 --bt, step 2 --bt --firth --approx --pThresh 0.01
#   seropositive_igg  log MFI among seropositive participants; steps 1 and 2 --qt
# Serostatus is the assay provider's binary call when the phenotype file carries it
# (serostatus_source: auto), otherwise MFI above the threshold.
p09b:
  run_id: p09b-20260928-02
  phenotype_file: /user/work/fh6520/fungwas_paper/data/derived/antibody/antigen_scan_20260920/phenotypes_antibody_all.txt
  covar_file: /user/work/fh6520/fungwas_paper/data/derived/antibody/antigen_scan_20260920/covars_antibody_all.txt
  keep_all_complete: /user/work/fh6520/fungwas_paper/data/derived/antibody/antigen_scan_20260920/keep_files/keep_antibody_all_complete.txt
  analysis_manifest: /user/work/fh6520/fungwas_paper/data/derived/antibody/antigen_scan_20260920/analysis_manifest.tsv
  covariates: [age, sex, PC1, PC2, PC3, PC4, PC5, PC6, PC7, PC8, PC9, PC10]
  serostatus_source: auto          # auto | manifest | derived
  seropositivity_threshold: 250    # MFI; seropositive = MFI > 250
  log_base: auto                   # auto | e | 10: base of the *_log_all columns (auto: checked from the data)
  min_manifest_agreement: 0.95     # agreement between provider serostatus and MFI > threshold needed to infer the log base
  regenie_module: apps/regenie/4.1
  plink_module: apps/plink2/2.00a68LM
  step1_bed: /bp1/mrcieu1/data/ukbiobank/genetic/variants/arrays/directly_genotyped/released/2017-07-04/data/derived/merged_chr1-22/chr1-22_merged
  step1_qc: "--maf 0.01 --mac 100 --geno 0.1 --hwe 1e-15 0 --mind 0.1"
  bgen_dir: /bp1/mrcieu1/data/ukbiobank/genetic/variants/arrays/imputed/released/2018-09-18/data/dosage_bgen   # data.chrNN.bgen
  bgen_sample: /bp1/mrcieu1/data/ukbiobank/genetic/variants/arrays/imputed/released/2018-09-18/data/dosage_bgen/data.chr1-22.sample
  extract_template: /user/work/fh6520/fungwas_paper/inputs/data/w_hm3_chrNN_only.txt   # NN = two-digit chromosome
  step2_bsize: 400
  bt_flags: "--bt --firth --approx --pThresh 0.01"
  manhattan_bin_bp: 1000000

# Genome-wide Stage 2 of the BMI models on the baseline-fitted weights, with LDSC genetic
# correlations (ordinary least squares, pooled covariance).
p12b:
  run_id: p12b-20260928-01
  models: [additive, log_additive, both, logscale_vqtl]
  regenie_role: comparator         # the standard REGENIE GWAS on the same sample is the comparator
  manhattan_bin_bp: 1000000
  lead_p: 5.0e-8

# Chromosomal-sex GWAS effects at the Fig. 2 testosterone exemplar variants.
p08b:
  source_arm: testosterone         # arm whose effect allele defines the alignment (exemplars are selected on it)

# UK Biobank imputed genotypes and tools ({chr} = 01..22). Authors' cluster paths; replace with your own.
ukb:
  bgen_dir: /bp1/mrcieu1/data/ukbiobank/genetic/variants/arrays/imputed/released/2018-09-18/data/dosage_bgen   # data.chrNN.bgen
