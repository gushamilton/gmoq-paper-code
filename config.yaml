# Settings for every analysis script: where the UK Biobank-derived inputs are, which package
# versions were used, and the analysis choices. Scripts read this file with read_config()
# (R/results_io.R); figures and tables read only results/.
#
# All file paths below are the authors' paths on their cluster. To rerun an analysis, replace
# them with the locations of your own copies of the inputs. Participant-level intermediates
# are written under private_root and never leave the cluster.
version: 1

# Cluster: Slurm partition and working directories.
bp:
  env_bootstrap: /user/work/fh6520/Gmoq_paper-validation-20260917/.local/validation-bootstrap-20260917-02/activate.sh   # environment used for the speed benchmarks
  account: sscm013902
  partition: short
  work_root: /user/work/fh6520/gmoq-paper-v1
  private_root: /user/work/fh6520/gmoq-paper-v1/private      # participant-level intermediates

# G-MoQ software. Stage 1 (Python) produced every quantile GWAS used here; Stage 2 is the R
# package fungwasStage2. Both are pinned to the commits below.
package:
  repo: https://github.com/gushamilton/GMoQ
  stage1:
    commit: 9c47e7ba56370e708810fff8c2c9ad3b723cbccf
    short: 9c47e7b
    root: /user/work/fh6520/G-MoQ-validation-9c47e7b
    python: /user/home/fh6520/miniforge3/envs/fungwas-stage1/bin/python
  # Stage 2 version used for every result. It provides the mixture weight-density option
  # density = "model" / "hybrid" / "stage1" for the weight builders.
  stage2:
    commit: 9fee67d1e510b81368d33b5b0ee223792bc6a3bd
    short: 9fee67d
    r_package: fungwasStage2
    r_package_version: 0.5.0
    lib: /user/work/fh6520/gmoq-paper-v1/Rlib/stage2-9fee67d
  # Second name for the same Stage 2 version, read by some scripts.
  stage2_hybrid:
    commit: 9fee67d1e510b81368d33b5b0ee223792bc6a3bd
    short: 9fee67d
    r_package: fungwasStage2
    r_package_version: 0.5.0
    lib: /user/work/fh6520/gmoq-paper-v1/Rlib/stage2-9fee67d
  # Earlier Stage 2 version; its default output is identical to the current one. Listed in
  # the software table.
  stage2_history:
    - commit: 759b5b3a0698a5fb0ab29a5fca554079aeb87f69
      short: 759b5b3
      r_package_version: 0.4.0
      lib: /user/work/fh6520/gmoq-paper-v1/Rlib/stage2-759b5b3
      used_by: "model-profile angles (Fig. 4b), BMI polygenic-score interactions and the weight-design simulation"

# Quantile levels u_t = seq(0.02, 0.98, length.out = 45) and the Stage 1 block structure.
# Trapezoid weights on this grid sum to 0.96.
grid:
  tau_from: 0.02
  tau_to: 0.98
  n_tau: 45
  blocks: 1000
  block_seed: 42

# Estimation choices shared by all analyses.
estimation:
  stage2_estimator: ols            # ordinary least squares in Stage 2 (no GLS)
  cov_source: pooled               # pooled Stage 1 covariance for empirical analyses
  density_mode: parametric_model_density   # single-component baselines (BMI, weight): weights use the model density
  # Two-component mixtures (testosterone and its shrinkage variants, JCV VP1, MCV VP1) are
  # fitted with both weight designs. 'model' divides every weight column by the fitted
  # mixture density; 'hybrid' divides the membership column by the Stage 1 kernel density
  # instead. 'model' is reported everywhere except unshrunk testosterone, where the gap
  # between the components is nearly empty (mixture density 0.46 times the kernel density at
  # u = 0.5) and 'hybrid' is reported. Read through mixture_design(cfg, fit).
  mixture_weight_designs: [hybrid, model]
  mixture_weights:
    default: model
    overrides:                     # hybrid where the weight-design simulation shows the model design
      testosterone: hybrid         # under-recovers membership: well-separated or bimodal mixtures
      testosterone_shrink_0_2: hybrid
      mcv_vp1_log_all: hybrid
  loco_mode: covariate             # Stage 1: REGENIE leave-one-chromosome-out prediction as a covariate
  weight_gates:
    beta_left_plus_right_tol: 1.0e-8   # tolerance on the mixture weight identity checked before fitting
  joint_test: hotelling            # joint Wald tests: T (nu - k + 1) / (k nu) ~ F(k, nu - k + 1)
  lack_of_fit: davies              # lack of fit: exact Davies p-values (Imhof and Satterthwaite as checks)
  het_tau_excess: n_minus_1        # heterogeneity tau from Q - (n - 1)
  het_boot: 2000                   # bootstrap resamples for heterogeneity intervals
  pca_parallel_draws: 300          # null draws for parallel analysis
  boot_seed: 20260923
  # Scale-invariant heterogeneity in the principal-component frame (het_test_pc()): PC1 and
  # PC2 scores of the whitened profiles, with directions cross-fitted over two random halves.
  het_pc:
    split_seed: 20260923           # the reported split; n_split further splits test sensitivity to it
    folds: 2                       # more folds make the fold statistics correlated (over-dispersed null)
    n_split: 50
    floor_nsim: 1000               # simulations for the detection floor and the simulated null
    floor_grid_step: 0.005
    recovery_nsim: 200             # simulations for recovery of the observed tau
    pc2_share_null_draws_per_resample: 50   # Fig. 5a interval: null draws per bootstrap resample
    exclude_traits: [log_lipoprotein_a]   # 35 leads; the shift + spread frame fits poorly

# Headline settings for BMI, the antibodies and the polygenic-score analysis.
headline:
  bmi_scale: log_bmi
  bmi_het_tau_previous: 0.116      # tau from Q - n on the unit-variance basis, 639 leads (reported for comparison)
  antibody_traits: [jcv_vp1_log_all, mcv_vp1_log_all]
  fto_prs_contrast: top_vs_bottom_10pct
  fig5d_twin_h2: 0.5               # twin heritability used as a sensitivity

# Polygenic-score interaction with the FTO variant (no leave-one-chromosome-out adjustment).
prs:
  analysis_sample: /user/work/fh6520/gmoq-paper-v1/private/P15_prs/p15-20261020-ct1e-5/prep/analysis.rds   # BMI sample with the leave-one-chromosome-out scores
  # Stage 1 runs restricted to the BMI lead variants, without LOCO (used for the PRS work)
  stage1_leads_bmi: /user/work/fh6520/Gmoq_paper-clinical-20260917/.local/prs-tilt-checks-20260923/stage1   # <arm>/chrNN, arms none covariate subtract sex0 sex1
  stage1_leads_log_bmi: /user/work/fh6520/gmoq-paper-v1/private/P05b_stage1_leads                          # log_bmi_<arm>/chrNN, arms none covariate
  loco: none
  score: plink_clump_threshold_1e-5_standardised_loo_chr   # PLINK C+T: r2 < 0.1, 250 kb, 1000 Genomes EUR, index P < 1e-5
  hc: HC0                          # heteroskedasticity-robust standard errors
  link_test_seed: 20260923
  covariates: [age, sex, PC1-PC10]
  run_id: p15-20261020-ct1e-5
  n: 461320
  lead_set: log_bmi_prs_none       # log-BMI lead profiles without LOCO; raw-scale BMI: bmi_prs_none
  pheno: /user/work/fh6520/fungwas_paper/data/derived/paper/phenotypes_paper.txt       # Stage 1 phenotype file
  covar: /user/work/fh6520/fungwas_paper/data/derived/paper/covars_with_sex_paper.txt  # Stage 1 covariates (age, sex, PC1-PC10)
  pheno_interaction_old: /user/work/fh6520/fungwas_paper/data/processed/phenotypes_final.txt   # earlier inputs, agreement check only
  covar_interaction_old: /user/work/fh6520/fungwas_paper/data/processed/covars_with_sex.txt
  keep_matched: /user/work/fh6520/Gmoq_paper-clinical-20260917/.local/prs-tilt-checks-20260923/keep_bmi_matched.txt   # the 461,320 Stage 1 participants
  partial_scores: /user/work/fh6520/gmoq-paper-v1/private/aux_prs_ld_fix/run-20261020-ct/p1e-5/partial_scores   # chrNN_partial.sscore
  score_threshold: 1.0e-5           # index-variant P threshold of the clumping-and-thresholding score
  score_training_gwas: /user/work/fh6520/fungwas_paper/results/regenie/combined/bmi_all.regenie   # REGENIE BMI GWAS (same participants: in-sample weights)
  lead_dosage_dir: /user/work/fh6520/fungwas_paper/data/derived/bmi_loo_prs/dosage_raw   # chrNN_lead.raw (plink2 --export A, REF allele counted)
  lead_pvar_dir: /user/work/fh6520/fungwas_paper/data/derived/bmi_loo_prs/pgen
  natural_scale_table: /user/work/fh6520/Gmoq_paper-clinical-20260917/.local/g-heterogeneity-20260922/G_implied_natural_scale.csv
  ldsc_h2_log_bmi: /user/work/fh6520/fungwas_paper/results/paper/ldsc/h2/regenie__log_bmi_additive.log   # LDSC 2.0.0, HapMap3, 1000 Genomes EUR LD scores
  ldsc_h2_bmi: /user/work/fh6520/fungwas_paper/results/paper/ldsc/h2/regenie__bmi_additive.log
  fto_snp: rs1421085
  fto_tail: 0.10                   # top vs bottom 10% of the polygenic score excluding chromosome 16
  boot: 2000

