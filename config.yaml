# Lead variants per trait.
leads:
  bmi:
    method: regenie_clump_inherited
    n_leads: 639
    source: /user/work/fh6520/fungwas_paper/results/pruned_hits/bmi_pruned_hits_p5e8_clumped.txt
    p_threshold: 5.0e-8
    note: same 639 used for log_bmi and every BMI scale; aligned to the BMI-increasing allele
  log_bmi:
    method: same_as_bmi
  weight:
    method: regenie_clump_rule_A   # REGENIE GWAS of height-adjusted weight, clumped as for BMI
    p_threshold: 5.0e-8
    note: the same clumping rule as BMI (secondary P < 1e-3, r2 < 0.01, 10 Mb, 1000 Genomes EUR)
  testosterone:
    source_dir: /user/work/fh6520/fungwas_paper/results/paper/lead_snps
    method: regenie_clump
  antibodies:
    method: antigen_scan_clump
  survey:
    method: stage1_delta_mu_clump_rule_A   # clumped on the Stage 1 change in mean
    p_threshold: 5.0e-8
    note: survey traits are clumped on the Stage 1 location effect (no REGENIE GWAS)

# Disclosure limits for exported aggregate results.
privacy:
  forbidden_column_patterns: ["(?i)^eid$", "(?i)^iid$", "(?i)^fid$", "(?i)^id$", "(?i)participant_?id", "(?i)sample_?id", "(?i)^f\\.eid"]
  max_rows_non_snp: 5000           # a table that is not per variant may have at most this many rows
  min_cell_count: 10               # histogram and count cells below this are suppressed
  max_file_mb: 50

